const spark=a=>{const m=Math.max(...a),n=Math.min(...a);return`<svg viewBox="0 0 100 30" width="100%" height="46" preserveAspectRatio="none"><polyline points="${a.map((v,i)=>`${i*20},${28-(v-n)/(m-n||1)*24}`).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`};
const bars=(a,lb,u)=>{const m=Math.max(...a,1);return`<svg viewBox="0 0 300 150" width="100%">${a.map((v,i)=>{const h=v/m*100;return`<rect x="${i*50+10}" y="${120-h}" width="30" height="${h}" rx="7" fill="${i==5?'var(--ac)':'var(--s2)'}"><title>${lb[i]}: ${fN(v)} ${u}</title></rect><text x="${i*50+25}" y="140" text-anchor="middle" font-size="11" fill="var(--mu)">${lb[i]}</text><text x="${i*50+25}" y="${114-h}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--tx)">${fN(v)}</text>`}).join('')}</svg>`};
const crd=(c,t,i,b,g,x='')=>`<div class="card ${c}" ${g?`data-go="${g}" tabindex="0" role="button"`:''}><div class="ch"><span class="ic">${I(i)}</span>${t}${x}</div>${b}</div>`;
function home(){const v=veh(),c=calc(),av=[];c.vc.forEach(x=>x.d<90&&av.push([x.n+(x.d<0?' vencido':' vence en '+x.d+' días'),col(x.d),'d']));if(c.rest!=null&&c.rest<5000)av.push(['Mantenimiento en '+fN(c.rest)+' km','wr','m']);
return`<h1>${v.nombre}${v.marca_modelo?' · '+v.marca_modelo:''}</h1><div class="grid">`+
crd('wide','Vehículo actual',TIPOS[v.tipo]||'car',`<div class="car" style="color:${COLS[v.color]||COLS.Azul};background:linear-gradient(135deg,var(--s2),color-mix(in srgb,${COLS[v.color]||COLS.Azul} 30%,var(--s2)))">${I(TIPOS[v.tipo]||'car',64)}</div><div class="kv"><div><small>Marca y modelo</small><b>${v.marca_modelo||'—'}</b></div><div><small>Matrícula</small><b>${v.matricula||'—'}</b></div><div><small>Kilómetros</small><b>${fN(c.km)} km</b></div><div><small>Año · Combustible</small><b>${v.anio||'—'} · ${v.combustible||'—'}</b></div></div>`,'',`<button class="b g" data-ev style="margin-left:auto">Editar</button>`)+
crd('','Gastos','euro',`<div class="big">${eur(c.gm)}</div><small style="color:var(--mu)">Este mes</small><div class="bar"><i style="width:${Math.min(100,c.gm/Math.max(...c.gs,1)*100)}%"></i></div><div class="kv" style="margin-top:12px"><div><small>Este año</small><b>${eur(c.ga)}</b></div><div><small>Total acumulado</small><b>${eur(c.gt)}</b></div></div>`,'g')+
crd('','Combustible','fuel',`<div class="kv"><div><small>Último repostaje</small><b>${c.rep?dmy(c.rep.fecha):'—'}</b></div><div><small>Litros</small><b>${c.rep?f2(c.rep.litros,' L'):'—'}</b></div><div><small>Precio</small><b>${c.rep?f2(c.rep.precio_litro,' €/L'):'—'}</b></div><div><small>Consumo medio</small><b>${f2(c.cons,' L/100')}</b></div><div><small>Coste por km</small><b>${f2(c.ckm,' €')}</b></div></div>`,'c')+
crd('','Kilómetros','gauge',`<div class="big">${fN(c.km)} km</div>${spark(c.es)}<div class="kv"><div><small>Este mes</small><b>${fN(c.kmm)} km</b></div><div><small>Este año</small><b>${fN(c.kma)} km</b></div></div>`,'k')+
crd('','Mantenimientos','clock',c.ult?`<div class="kv"><div><small>Último</small><b>${c.ult.tipo}</b></div><div><small>Próximo a los</small><b>${fN(c.ult.proximo_km)} km</b></div></div>${c.rest!=null?`<p><span class="pill ${c.rest<5000?'wr':'ok'}">Faltan ${fN(c.rest)} km</span></p>`:''}`:'<div class="empty">Sin mantenimientos</div>','m')+
crd('','Próximos vencimientos','file',c.vc.slice(0,4).map(x=>`<div class="li" data-go="d"><div><b>${x.n}</b><small style="display:block;color:var(--mu)">${dmy(x.f)}</small></div><span class="pill ${col(x.d)}">${dl(x.d)}</span></div>`).join('')||'<div class="empty">Sin vencimientos</div>','d')+
crd('','Avisos','bell',av.map(a=>`<div class="li" data-go="${a[2]}"><span>${a[0]}</span><span class="pill ${a[1]}">Ver</span></div>`).join('')||'<div class="empty">Todo en orden</div>')+'</div>'}
function resumen(id){const c=id=='c',g={};items(id).forEach(x=>{if(x.a==null)return;const k=S.sm=='m'?x.f.slice(0,7):x.f.slice(0,4),o=g[k]||(g[k]={a:0,l:0,n:0});o.a+=x.a;o.n++;if(c)o.l+=x.r.litros||0});
const ks=Object.keys(g).sort().reverse(),mx=Math.max(...ks.map(k=>g[k].a),1),tot=ks.reduce((s,k)=>s+g[k].a,0);
return`<div class="card rs"><div class="bh"><div class="ch" style="margin:0"><span class="ic">${I('chart')}</span>${c?'Combustible':'Gastos'} por ${S.sm=='m'?'mes':'año'}</div><div class="seg"><button class="${S.sm=='m'?'on':''}" data-sm="m">Por mes</button><button class="${S.sm=='y'?'on':''}" data-sm="y">Por año</button></div></div>`+(ks.length?ks.map(k=>{const o=g[k];return`<div class="pr"><span>${S.sm=='m'?MN[+k.slice(5)-1].slice(0,3)+' '+k.slice(0,4):k}</span><div class="bar"><i style="width:${o.a/mx*100}%"></i></div><div><b>${eur(o.a)}</b><small>${c?f2(o.l,' L')+' · '+o.n+' repostajes':o.n+' gastos'}</small></div></div>`}).join('')+`<div class="li" style="cursor:default;border-top:1px solid var(--bd);border-radius:0;margin-top:6px"><span>Total mostrado</span><b>${eur(tot)}</b></div>`:'<div class="empty">Sin datos todavía</div>')+'</div>'}
function lst(t){const it=items(t.id);return`<h1>${t.n}</h1><div class="bh"><small style="color:var(--mu)">${veh().nombre}${veh().matricula?' · '+veh().matricula:''}</small><button class="b p" data-open="${t.tb}">${I('plus',18)}${t.b}</button></div>${t.id=='g'||t.id=='c'?resumen(t.id):''}<div class="card">${it.length?it.map(x=>`<div class="row" data-et="${x.t}" data-id="${x.r.id}" tabindex="0" role="button"><span class="ic2">${I(IC[x.t])}</span><div><b>${TX[x.t](x.r)}</b><small>${t.id=='d'?'Vence el ':''}${dmy(x.f)}${t.id=='g'?' · '+LB[x.t]:''}</small></div><span class="am">${x.a!=null?eur(x.a):''}</span></div>`).join(''):`<div class="empty">Aún no hay registros. Pulsa «${t.b}» para crear el primero.</div>`}</div>`}
function stats(){const c=calc();return`<h1>Estadísticas</h1><div class="charts"><div class="card"><div class="ch"><span class="ic">${I('euro')}</span>Gasto mensual (€)</div>${bars(c.gs,c.ml,'€')}</div><div class="card"><div class="ch"><span class="ic">${I('gauge')}</span>Kilómetros por mes</div>${bars(c.ks,c.ml,'km')}</div></div>`}
function render(){const t=TB.find(x=>x.id==S.tab),th=document.documentElement.dataset.theme=='light';
$('#sd').innerHTML=`<div class="logo"><i>${I('car')}</i>Garaje</div>`+TB.map(x=>`<button class="nv ${x.id==S.tab?'on':''}" data-t="${x.id}">${I(x.i)}${x.n}</button>`).join('');
$('#bn').innerHTML=TB.map(x=>`<button class="${x.id==S.tab?'on':''}" data-t="${x.id}">${I(x.i)}${x.n}</button>`).join('');
$('#ch').innerHTML=S.veh.map(v=>`<button class="chip ${v.id==S.cur?'on':''}" data-v="${v.id}">${v.nombre}</button>`).join('')+`<button class="chip add" data-open="vehiculos">+ Añadir vehículo</button>`;
$('#tg').innerHTML=I(th?'moon':'sun');$('#out').innerHTML=I('out');
const w=$('#vw');w.innerHTML=!S.cur?`<div class="card"><div class="empty"><p>Todavía no tienes ningún vehículo.</p><button class="b p" data-open="vehiculos">${I('plus',18)}Añadir mi primer vehículo</button></div></div>`:S.tab=='ini'?home():S.tab=='e'?stats():lst(t);
w.classList.remove('view');void w.offsetWidth;w.classList.add('view')}
function open(tb,r=null){const f=F[tb];M={t:tb,r};const fd=f.fl.map(([n,l,t,p,o])=>{let v=r?r[n]:null;if(v==null)v=t=='date'&&n=='fecha'?ymd(new Date()):t=='sel'&&r==null?'':'';
if(t=='int'||t=='dec')v=v==null?'':String(v).replace('.',',');if(t=='sel'&&n=='lleno'&&r)v=r.lleno?'Sí':'No';
const inp=t=='calc'?`<output id="f_imp">${r&&r.importe!=null?eur(r.importe):'Calculado automáticamente'}</output>`:t=='sel'?`<select id="f_${n}">${p.split('|').map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`:`<input id="f_${n}" type="${t=='date'?'date':'text'}" ${t=='int'||t=='dec'?'inputmode="decimal"':''} placeholder="${p||''}" value="${v}">`;
return`<label class="cap ${t=='text'?'full':''} ${v!==''&&t!='sel'?'ok':''}" data-n="${n}" data-t="${t}" data-o="${o||''}"><span>${l}${o?' (opcional)':''}</span>${inp}</label>`}).join('');
$('#md').innerHTML=`<div class="ov" data-ov><div class="md" role="dialog" aria-modal="true"><div class="mh"><span class="ic">${I(IC[tb])}</span><h2>${r?'Editar registro':f.a}</h2><button class="x" data-close aria-label="Cerrar">${I('x',18)}</button></div><div class="fl">${fd}</div><div class="mf">${r?`<button class="b g" data-del style="margin-right:auto;color:var(--er)">Eliminar</button>`:''}<button class="b g" data-close>Cancelar</button><button class="b p" data-save>${I('check',18)}Guardar</button></div></div></div>`;
if(!r)setTimeout(()=>{const i=document.querySelector('#md input:not([type=date])');i&&i.focus()},60)}
const close=()=>{$('#md').innerHTML='';M=null};
async function guardar(){const rec={};let bad=false;document.querySelectorAll('#md .cap').forEach(c=>{const n=c.dataset.n,t=c.dataset.t,o=c.dataset.o;if(t=='calc')return;const raw=$('#f_'+n).value.trim();let v=raw,e=false;
if(!raw){v=null;e=!o}else if(t=='int'||t=='dec'){v=PA[t](raw);e=isNaN(v)||v<0}
if(n=='lleno')v=raw=='Sí';c.classList.toggle('err',e);if(e)bad=true;rec[n]=v});
if(bad)return toast('Revisa los campos marcados en rojo',1);
if(M.t=='repostajes')rec.importe=Math.round(rec.litros*rec.precio_litro*100)/100;
const bt=$('[data-save]');bt.disabled=true;let q,id=M.r&&M.r.id;
if(M.t=='vehiculos')q=M.r?sb.from('vehiculos').update(rec).eq('id',id).select().single():sb.from('vehiculos').insert(rec).select().single();
else{if(!M.r)rec.vehiculo_id=S.cur;q=M.r?sb.from(M.t).update(rec).eq('id',id):sb.from(M.t).insert(rec)}
const{data,error}=await q;if(error){bt.disabled=false;return toast('No se pudo guardar: '+error.message,1)}
if(M.t=='vehiculos'&&!M.r)S.cur=data.id;
if(rec.km&&rec.km>(veh()?veh().km_actuales||0:0)&&M.t!='vehiculos')await sb.from('vehiculos').update({km_actuales:rec.km}).eq('id',S.cur);
close();await datos();toast('Guardado correctamente')}
async function eliminar(){const v=M.t=='vehiculos';if(!confirm(v?'¿Eliminar este vehículo y TODOS sus registros? No se puede deshacer.':'¿Eliminar este registro? No se puede deshacer.'))return;
const{error}=await sb.from(M.t).delete().eq('id',M.r.id);if(error)return toast('No se pudo eliminar: '+error.message,1);close();await datos();toast('Eliminado')}
document.addEventListener('click',async e=>{const c=s=>e.target.closest(s);
if(e.target.matches('[data-ov]'))return close();
if(c('.md')&&!c('[data-close]')&&!c('[data-save]')&&!c('[data-del]'))return;
if(c('[data-save]'))return guardar();if(c('[data-del]'))return eliminar();if(c('[data-close]'))return close();
if(c('[data-ev]'))return open('vehiculos',veh());
if(c('[data-open]'))return open(c('[data-open]').dataset.open);
if(c('[data-et]')){const t=c('[data-et]').dataset.et;return open(t,S.d[t].find(x=>x.id==c('[data-et]').dataset.id))}
if(c('[data-sm]')){S.sm=c('[data-sm]').dataset.sm;return render()}
if(c('[data-t]')){S.tab=c('[data-t]').dataset.t;return render()}
if(c('[data-v]')){S.cur=c('[data-v]').dataset.v;return datos()}
if(c('[data-go]')){S.tab=c('[data-go]').dataset.go;render();scrollTo(0,0);return}
if(c('#tg')){const r=document.documentElement,n=r.dataset.theme=='light'?'dark':'light';r.dataset.theme=n;try{localStorage.setItem('tema',n)}catch(x){}render()}
if(c('#out'))await sb.auth.signOut()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')close();if(e.key=='Enter'&&e.target.matches&&e.target.matches('.row,.card,.li'))e.target.click();if(e.key=='Enter'&&e.target.closest&&e.target.closest('#au'))$('#ent').click()});
document.addEventListener('input',e=>{const c=e.target.closest('.cap');if(!c)return;c.classList.remove('err');c.classList.toggle('ok',!!e.target.value.trim()||e.target.tagName=='SELECT');
const o=$('#f_imp');if(o){const l=PA.dec($('#f_litros').value),p=PA.dec($('#f_precio_litro').value),w=o.closest('.cap');if(l>=0&&p>=0){o.textContent=eur(l*p);w.classList.add('ok')}else{o.textContent='Calculado automáticamente';w.classList.remove('ok')}}});
async function acceso(reg){const em=$('#em').value.trim(),pw=$('#pw').value,m=$('#am');m.style.color='var(--er)';m.textContent='';if(!em||pw.length<6){m.textContent='Escribe tu correo y una contraseña de al menos 6 caracteres.';return}
const r=reg?await sb.auth.signUp({email:em,password:pw}):await sb.auth.signInWithPassword({email:em,password:pw});
if(r.error)m.textContent=r.error.message=='Invalid login credentials'?'Correo o contraseña incorrectos.':r.error.message;else if(reg&&!r.data.session){m.style.color='var(--ok)';m.textContent='Cuenta creada. Revisa tu correo y pulsa el enlace de confirmación; después pulsa Entrar.'}}
$('#ent').onclick=()=>acceso(false);$('#reg').onclick=()=>acceso(true);$('#aui').innerHTML=I('car');
function pantalla(ok){$('#au').hidden=ok;$('#app').hidden=!ok;$('#bn').hidden=!ok}
sb.auth.onAuthStateChange((ev,s)=>{const u=s&&s.user;if(u&&S.user&&S.user.id==u.id)return;S.user=u||null;if(u){pantalla(true);setTimeout(datos,0)}else{pantalla(false);S.veh=[];S.cur=null}});
let tema=null;try{tema=localStorage.getItem('tema')}catch(x){}
document.documentElement.dataset.theme=tema||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
